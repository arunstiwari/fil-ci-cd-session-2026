# Static scanner configuration. The Jenkinsfile passes only the dynamic values
# (projectVersion, and the server URL/token, which withSonarQubeEnv injects).
sonar.projectKey=python-app
sonar.projectName=python-app

# Keep production code and tests distinct so Sonar does not report coverage or
# code smells on the tests themselves.
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Reports produced by the "Unit tests & coverage" stage.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

sonar.exclusions=**/__pycache__/**,htmlcov/**
sonar.sourceEncoding=UTF-8
