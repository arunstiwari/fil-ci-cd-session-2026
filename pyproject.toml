[project]
name = "python-app"
version = "0.1.0"
description = "Minimal FastAPI service demonstrating a CI pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import sorting, B bugbear, UP pyupgrade, D docstrings
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]  # test functions don't need docstrings

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
